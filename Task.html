<!DOCTYPE html>
<html lang="en">

<head>

    <title>EMPLOYEE MS</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
        }

        .button {
            float: right;
            margin-right: 100px;
            margin-left: 100px;
            margin-top: 10px;
            border: 5px;
            padding-left: 15px;
            font-family: 'Times New Roman', Times, serif;


        }

        .log {
            margin-left: 100px;
            margin-top: 20px;
            margin-right: 30px;
            position: absolute;
            padding-left: 25px;
            padding-right: 25px;
        }

        .log img {
            border-radius: 90px;

        }

        .button button {
            background-color: orange;
            border: none;
            padding-left: 10px;
            font-family: 'Times New Roman', Times, serif;
        }

        .form {
            margin-top: 100px;

            border-radius: 150px;
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            border: 10px;
            font-style: italic;

        }

        .form h1 {
            padding-left: 100px;
            padding-right: 100px;
            margin-top: 100px;
            margin-bottom: 50px;


        }

        .form button {
            width: 140px;
            height: 30px;
            border: 1 px solid beige;
            border-radius: 10px;
            background-color: blue;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
        }

        button:hover {
            background-color: aqua;
            transition: 3s ease-in-out;
        }



        .form label {

            width: 150px;
            display: inline-block;
        }

        .form input {
            border-radius: 50px;
            border: 1px solid #ccc;
            padding: 8px;
            width: 200px;
        }

        .btn {}

        .btn button {
            background-color: rgb(224, 212, 235);
            width: 180px;
            height: 30px;
            border: 5px;
            border-radius: 50px;
            padding-right: 30px;
            font-weight: bold;
            font-size: 20px;

        }

        .card {

            margin-top: 10px;
            padding-top: 20px;
            background: yellowgreen;
            margin: 120px auto;
            width: 350px;
            height: 600px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);

        }

        .cord button {
            margin-bottom: 10px;

        }
    </style>

</head>

<body>
    <header>




    </header>
    <div class="card">
        <h1>EMS</h1>
        <div class="log">
            <img src="My logo.jpeg" alt="" width="100px" height="60px">
        </div>

        <div class="form">

            <form action="#">



                <label for="Email Adres">Email </label>
                <input type="Email" placeholder="Enter your email" class="Email"> <br> <br>
                <label for="Password">Password</label>
                <input type="password" placeholder="Enter your Password" class="password"> <br> <br> <br>

                <button type="submit">Login</button> <br> <br>
                <button type="submit">Forgot Password</button><br> <br>
                <button type="submit">Register</button>

            </form>
        </div>
    </div>

</body>

</html>
